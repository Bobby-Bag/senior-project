{% extends "base.html" %}
{% block title %}Travel Organizer - Login{% endblock %}
{% block content %}
    <style>
        .login-header {
            margin-top: 90px; /* Adjust this value as needed */
            text-align: center;
            font-size: 3em;
        }
    </style>
    <form method="POST">
        <h1 class="login-header" align="center">Login</h1>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter email"
            />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter password"
            />
        </div>
        <br/>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
{% endblock %}
