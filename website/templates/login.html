{% extends "base.html" %} {% block title %}Travel Organizer - Login{% endblock %} {% block content %}
    <form method="POST">
        <h1 align="center"style="padding-top: 55px;">Login</h1>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter email"
            />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter password"
            />
        </div>
        <br/>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
{% endblock %}
