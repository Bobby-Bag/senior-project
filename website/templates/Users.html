<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/login.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Roboto, sans-serif;
            color: black;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.90);
            border-radius: 8px;
        }
        h1 {
            color: black;
            margin-bottom: 30px;
        }
        .list-group-item {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            text-align: center;
        }
        .list-group-item a {
            color: inherit;
            text-decoration: none;
            flex-grow: 1;
        }
        .list-group-item a:hover {
            text-decoration: underline;
        }
        .badge {
            margin-left: 15px;
        }
        .back-button {
            margin-top: 20px;
        }
        .nav-item {
            margin-right: 30px;
        }

        .navbar-brand img {
            height: 40px;
            width: auto;
        }

        .nav-link img {
            height: 30px;
        }

        .nav-item #explore img {
            height: 30px;
        }

        .navbar {
            background: linear-gradient(to right, #354C9A, #354C9A);
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .90);
        }

        .navbar-collapse {
            display: flex;
            justify-content: space-between; /* Distribute space between items */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbar">
            <div class="navbar-nav">
                <a class="nav-item nav-link" id="home" href="/">
                    <img src="/static/Icons/home.png" alt="Home">
                </a>
                <a class="nav-item nav-link" id="settings" href="/Users">
                    <img src="/static/Icons/locate-512-white.png" alt="Explore">
                </a>
            </div>
            <div class="navbar-nav ml-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <img src="/static/Icons/img.png" alt="Menu Icon">
                    </a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" id="account" href="/account">Account</a>
                        <a class="dropdown-item" id="logout" href="/logout">
                            <span class="logout-emblem"></span>Logout
                        </a>
                    </div>
                </li>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1 class="text-center">Explore Other Photo Mappers</h1>
        <ul class="list-group">
            {% for user in users %}
                <li class="list-group-item">
                    <a href="{{ url_for('views.user_pins', user_id=user.id) }}">{{ user.first_name }}</a>
                    <span class="badge badge-primary badge-pill">ID: {{ user.id }}</span>
                </li>
            {% endfor %}
        </ul>
        <div class="text-center back-button">
            <a href="{{ url_for('views.home') }}" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
