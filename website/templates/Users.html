<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/login.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Roboto, sans-serif;
            color: black;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7); /* Black background with 0.7 opacity */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            color: white; /* Change text color to white for readability */
        }
        h1 {
            color: white; /* Change to white to make it stand out on the dark background */
            margin-bottom: 30px;
        }
        .list-group-item {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            text-align: center;
            background: none; /* Ensure list items are transparent */
            color: white; /* Change text color to white for readability */
        }
        .list-group-item a {
            color: white; /* Change link color to white */
            text-decoration: none;
            flex-grow: 1;
        }
        .list-group-item a:hover {
            text-decoration: underline;
        }
        .badge {
            margin-left: 15px;
        }
        .back-button {
            margin-top: 20px;
        }
        .nav-item {
            margin-right: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbar"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbar">

            <div class="navbar-nav">
                    <a class="nav-item nav-link" id="home" href="/">Home</a>
                    <a class="nav-item nav-link" id="account" href="/account">Account</a>
                    <a class="nav-item nav-link" id="settings" href="/Users">Explore</a>
                    <a class="nav-item nav-link" id="logout" href="/logout">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1 class="text-center">Explore Other Photo Mappers</h1>
        <ul class="list-group">
            {% for user in users %}
                <li class="list-group-item">
                    <a href="{{ url_for('views.user_pins', user_id=user.id) }}">{{ user.first_name }}</a>
                    <span class="badge badge-primary badge-pill">ID: {{ user.id }}</span>
                </li>
            {% endfor %}
        </ul>
        <div class="text-center back-button">
            <a href="{{ url_for('views.home') }}" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
